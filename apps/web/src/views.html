<template id="methodology-template">
      <div class="page-title-row">
        <div>
          <div class="eyebrow"><span class="eyebrow-line"></span> SCIENTIFIC METHOD</div>
          <h1>Separate what is <em>measured.</em></h1>
          <p class="lede">Source annotations, independent derivations, and assumptions remain distinct.</p>
        </div>
      </div>
      <div class="method-list">
        <article><span class="method-index">01</span>
          <div>
            <h3>Source-provided PET</h3>
            <p>Stored exactly as supplied by the source release, with its original scenario and key-agent references.
              This repository has no imported InterHub metadata, so no source PET values are currently available.</p>
            <span class="method-tag">SOURCE ANNOTATION · NOT IMPORTED</span>
          </div>
        </article>
        <article><span class="method-index">02</span>
          <div>
            <h3>Center-point occupancy PET</h3>
            <p>For non-overlapping sequential occupancy of the same conflict region: second agent entry time minus first
              agent exit time. This implementation uses linear interpolation for boundary crossings. Simultaneous
              occupancy is undefined as ordinary sequential PET; it is kept separate.</p><span
              class="method-tag">DERIVED · FIXTURE ONLY</span>
          </div>
        </article>
        <article><span class="method-index">03</span>
          <div>
            <h3>Vehicle-footprint occupancy</h3>
            <p>Requires verified vehicle dimensions and a documented conflict-zone geometry. The current fixture does
              not produce this measurement; no dimensions or footprints are inferred for research vehicles.</p><span
              class="method-tag">NOT AVAILABLE</span>
          </div>
        </article>
        <article><span class="method-index">04</span>
          <div>
            <h3>Interaction intensity</h3>
            <p>InterHub’s original intensity is based on a minimum-effort conflict-resolution formulation and reported
              in acceleration units. This project does not reproduce it until the exact upstream implementation and
              input conventions are checked against a pinned source revision.</p><span class="method-tag">SOURCE METRIC
              · NOT REPRODUCED</span>
          </div>
        </article>
      </div>
      <div class="method-callout"><span>!</span>
        <p>PET alone must not be interpreted as a probability of collision or a legally established risk category.</p>
      </div>
      <div class="source-citation">SOURCE REFERENCES <a href="https://github.com/zxc-tju/InterHub/blob/main/dataset.md"
          target="_blank" rel="noreferrer">InterHub data dictionary ↗</a><a
          href="https://github.com/zxc-tju/InterHub/blob/main/1_interaction_extract.py" target="_blank"
          rel="noreferrer">Interaction extraction implementation ↗</a></div>
    </template>

<template id="about-template">
      <div class="page-title-row">
        <div>
          <div class="eyebrow"><span class="eyebrow-line"></span> ABOUT THIS PROJECT</div>
          <h1>Traffic Conflict <em>Atlas.</em></h1>
          <p class="lede">An open-source scientific research platform for understanding vehicle interaction events and
            surrogate safety measures.</p>
        </div>
      </div>
      <div class="about-copy">
        <p>The goal is to make interaction records searchable, replayable, and reproducible while preserving the
          distinctions between original annotations, independently derived metrics, and missing data.</p>
        <h3>Current local build</h3>
        <p>The workbench, API, and geometry validation fixture run locally without external services. No real-world
          driving dataset is bundled. Research catalog, spatial map, and aggregate statistics remain empty until a
          dataset release with suitable rights and provenance is imported.</p>
        <h3>Open source</h3>
        <p>Licensed under the MIT License. Source dataset licenses and redistribution terms remain separate and must be
          verified for every imported dataset and map.</p><a href="https://github.com/zxc-tju/InterHub" target="_blank"
          rel="noreferrer">Upstream InterHub project ↗</a>
      </div>
    </template>
