    <!-- Command 3 -->
    <text x="45" y="308" fill="#4fd1bb" font-weight="600">➜ </text>
    <text x="65" y="308" fill="#58c8e7" font-weight="600">traffic-conflicts </text>
    <text x="215" y="308" fill="#e4eaf0">curl -s http://127.0.0.1:8080/v1/health | jq .</text>

    <text x="45" y="330" fill="#8391a0">{</text>
    <text x="65" y="348" fill="#c1a5f3">  "service"<tspan fill="#8391a0">: </tspan><tspan fill="#efb65e">"traffic-conflict-atlas"</tspan><tspan fill="#8391a0">,</tspan></text>
    <text x="65" y="366" fill="#c1a5f3">  "status"<tspan fill="#8391a0">: </tspan><tspan fill="#4fd1bb">"ok"</tspan><tspan fill="#8391a0">,</tspan></text>
    <text x="65" y="384" fill="#c1a5f3">  "researchScenarios"<tspan fill="#8391a0">: </tspan><tspan fill="#58c8e7">0</tspan><tspan fill="#8391a0">,</tspan></text>
    <text x="65" y="402" fill="#c1a5f3">  "syntheticFixtures"<tspan fill="#8391a0">: </tspan><tspan fill="#58c8e7">1</tspan></text>
    <text x="45" y="420" fill="#8391a0">}</text>

    <!-- Command 4 -->
    <text x="45" y="454" fill="#4fd1bb" font-weight="600">➜ </text>
    <text x="65" y="454" fill="#58c8e7" font-weight="600">traffic-conflicts </text>
    <text x="215" y="454" fill="#e4eaf0">make test</text>
    <text x="45" y="476" fill="#4fd1bb">ok</text>
    <text x="75" y="476" fill="#8391a0">traffic-conflicts/services/api/cmd/atlas (0.936s)</text>
    <text x="45" y="494" fill="#4fd1bb">Ran 18 tests in 0.077s · OK</text>
  </g>
</svg>